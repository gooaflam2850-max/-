<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1877f2">
    
    <!-- PWA Setup & Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>SocialX V3.3 Modern Flat Mobile</title>
    <style>
        :root{--primary:#1877f2;--bg:#f0f2f5;--card:#fff;--text:#050505;--sub:#65676b;--border:#e4e6eb;--input:#f0f2f5;--danger:#e41e3f;--shadow:0 1px 4px #0001}
        body.dark{--bg:#18191a;--card:#242526;--text:#e4e6eb;--sub:#b0b3b8;--border:#393a3b;--input:#3a3b3c;--shadow:0 1px 4px #0004}
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,"Segoe UI",sans-serif}
        body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
        button,input,textarea{font:inherit}
        button{cursor:pointer}
        .hidden{display:none!important}
        .app{max-width:480px;height:100vh;margin:auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
        header{height:58px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
        .logo{font-size:23px;font-weight:900;color:var(--primary)}
        .icon{border:0;background:var(--input);color:var(--text);width:38px;height:38px;border-radius:50%}
        .content{flex:1;overflow:auto;padding:12px 12px 78px}
        .page{display:none}.page.active{display:block}
        .card{background:var(--card);border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
        
        /* تصميم صفحات التطبيق */
        .tab-content { display: none; flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .tab-content.active { display: block; }

        /* تصميم قسم الريلز */
        .reels-container {
            height: calc(100vh - 120px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            background: #000;
        }
        .reel-item {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reel-overlay {
            position: absolute;
            bottom: 20px;
            right: 15px;
            left: 15px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:30}
        .nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px}
        .nav button b{display:block;font-size:20px}
        .nav button.active{color:var(--primary)}
    </style>
</head>
<body>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>

    <div class="app">
        <header>
            <div class="logo">SocialX</div>
            <button class="icon">🔍</button>
        </header>
        
        <div class="content">
            <!-- الصفحة الرئيسية -->
            <div id="homeTab" class="tab-content active">
                <div class="card">
                    <h2>الرئيسية 🏠</h2>
                    <p style="color:var(--sub); margin-top:5px;">محتوى المنشورات والقصص يظهر هنا.</p>
                </div>
            </div>

            <!-- صفحة الريلز الجديدة -->
            <div id="reelsTab" class="tab-content">
                <div class="reels-container">
                    <div class="reel-item">
                        <video class="reel-video" src="" controls loop poster="https://via.placeholder.com/480x800?text=Reel+1"></video>
                        <div class="reel-overlay">
                            <h3>@username</h3>
                            <p>فيديو قصير ريلز تجريبي #SocialX</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- صفحة الرسائل -->
            <div id="chatTab" class="tab-content">
                <div class="card">
                    <h2>الرسائل 💬</h2>
                    <p style="color:var(--sub); margin-top:5px;">قائمة المحادثات الفورية.</p>
                </div>
            </div>

            <!-- صفحة الملف الشخصي -->
            <div id="profileTab" class="tab-content">
                <div class="card">
                    <h2>الملف الشخصي 👤</h2>
                    <p style="color:var(--sub); margin-top:5px;">إعدادات حسابك ومعلوماتك.</p>
                </div>
            </div>
        </div>

        <!-- شريط التنقل السفلي -->
        <nav class="nav">
            <button class="active" onclick="switchTab('homeTab', this)"><b>🏠</b>الرئيسية</button>
            <button onclick="switchTab('reelsTab', this)"><b>🎬</b>ريلز</button>
            <button onclick="switchTab('chatTab', this)"><b>💬</b>الرسائل</button>
            <button onclick="switchTab('profileTab', this)"><b>👤</b>الملف الشخصي</button>
        </nav>
    </div>

    <script>
        // دالة التنقل بين التبويبات
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>

</body>
</html>
