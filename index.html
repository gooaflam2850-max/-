<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1877f2">
    
    <!-- PWA Setup & Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>SocialX V3.3 Modern Flat Mobile</title>
    <style>
        :root{--primary:#1877f2;--bg:#f0f2f5;--card:#fff;--text:#050505;--sub:#65676b;--border:#e4e6eb;--input:#f0f2f5;--danger:#e41e3f;--shadow:0 1px 4px #0001}
        body.dark{--bg:#18191a;--card:#242526;--text:#e4e6eb;--sub:#b0b3b8;--border:#393a3b;--input:#3a3b3c;--shadow:0 1px 4px #0004}
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,"Segoe UI",sans-serif}
        body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
        button,input,textarea{font:inherit}
        button{cursor:pointer}
        .hidden{display:none!important}
        .app{max-width:480px;height:100vh;margin:auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
        header{height:58px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
        .logo{font-size:23px;font-weight:900;color:var(--primary)}
        .icon{border:0;background:var(--input);color:var(--text);width:38px;height:38px;border-radius:50%}
        .content{flex:1;overflow:auto;padding:12px 12px 78px}
        .page{display:none}.page.active{display:block}
        .card{background:var(--card);border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
        .stories{display:flex;gap:9px;overflow:auto;margin-bottom:12px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
        .story{min-width:78px;height:108px;border-radius:12px;overflow:hidden;position:relative;background:#111;border:2px solid var(--primary)}
        .story img,.story video{width:100%;height:100%;object-fit:cover}.story span{position:absolute;bottom:5px;right:4px;left:4px;color:#fff;font-size:10px;text-align:center;text-shadow:0 1px 3px #000}
        .addstory{background:var(--input);border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--primary);font-weight:bold}
        .trigger{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ddd}.pill{flex:1;background:var(--input);padding:11px 15px;border-radius:22px;color:var(--sub)}
        .post-head{display:flex;justify-content:space-between;align-items:center}.user{display:flex;gap:9px;align-items:center;cursor:pointer}.name{font-weight:bold;font-size:14px}.time{font-size:11px;color:var(--sub);margin-top:3px}
        .post-text{line-height:1.55;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.media{width:100%;max-height:360px;object-fit:cover;border-radius:9px;background:#000;display:block}
        .stats{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;border-bottom:1px solid var(--border);padding:8px 0}.actions{display:flex}.action{flex:1;border:0;background:none;color:var(--sub);padding:9px 3px;font-weight:bold;border-radius:7px}.action.liked{color:var(--danger)}.comments{border-top:1px solid var(--border);margin-top:5px;padding-top:8px}.comment{background:var(--input);border-radius:13px;padding:8px 11px;margin:6px 0;font-size:13px}.comment small{color:var(--sub)}
        input,textarea,.select{width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:9px;padding:11px;outline:none;margin:5px 0 9px}.btn{width:100%;border:0;border-radius:9px;padding:11px;background:var(--primary);color:#fff;font-weight:bold}.secondary{background:var(--input);color:var(--text)}.danger{background:var(--danger);color:#fff}
        .nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:30}.nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px}.nav button b{display:block;font-size:20px}.nav button.active{color:var(--primary)}
        .search{display:flex;gap:7px}.search input{margin:0}.list{display:flex;flex-direction:column;gap:8px}
    </style>
</head>
<body>

    <script>
        // تسجيل Service Worker لتمكين ميزات تطبيق الـ PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>

    <div class="app">
        <header>
            <div class="logo">SocialX</div>
            <button class="icon">🔍</button>
        </header>
        
        <div class="content">
            <div class="card">
                <h2>أهلاً بك في SocialX V3.3</h2>
                <p style="color:var(--sub); margin-top:5px;">التطبيق جاهز الآن للتحويل إلى APK عبر PWABuilder.</p>
            </div>
        </div>

        <nav class="nav">
            <button class="active"><b>🏠</b>الرئيسية</button>
            <button><b>💬</b>الرسائل</button>
            <button><b>👤</b>الملف الشخصي</button>
        </nav>
    </div>

</body>
</html>
